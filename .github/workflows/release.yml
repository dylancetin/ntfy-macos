name: Release

# Only a deliberately pushed tag can initiate a release; ordinary CI cannot.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate stable release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $TAG_PATTERN ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH (stable SemVer, no leading zeros).' >&2
            exit 1
          fi
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve locked dependencies
        run: swift package resolve --force-resolved-versions

      - name: Run tests
        run: swift test --force-resolved-versions

      - name: Build explicitly unnotarized app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_IDENTITY: '-'
        run: ./build-app.sh

      - name: Check dependency files stayed unchanged
        run: git diff --exit-code -- Package.swift Package.resolved

      - name: Package app and SHA256 checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in arm64|x86_64) ;; *) echo 'Unsupported architecture' >&2; exit 1 ;; esac
          ARCHIVE="ntfy-macos-$RELEASE_TAG-$ARCH-ad-hoc-unnotarized.tar.gz"
          mkdir -p .build/release-assets
          tar -czf ".build/release-assets/$ARCHIVE" -C .build/release ntfy-macos.app
          {
            printf 'Repository: %s\nTag: %s\nCommit: %s\nArchitecture: %s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$(git rev-parse HEAD)" "$ARCH"
            echo 'Signing: ad-hoc; NOT Developer ID signed; NOT notarized.'
            echo 'Provenance: GitHub attestation identifies this workflow, not Apple trust.'
            xcodebuild -version
            swift --version
          } > .build/release-assets/BUILD-INFO.txt
          cd .build/release-assets
          shasum -a 256 "$ARCHIVE" BUILD-INFO.txt > SHA256SUMS

      - name: Pass release assets to publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: .build/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Write/OIDC tokens are only available to publishing, never package builds/tests.
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download this run's release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Attest release artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/BUILD-INFO.txt
            dist/SHA256SUMS

      - name: Publish clearly labeled release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" dist/provenance.jsonl
          cat > release-notes.md <<'NOTES'
          This is an **ad-hoc signed, unnotarized** native-architecture build for local evaluation.
          It is **not** Developer ID signed or Apple-notarized. Gatekeeper may reject downloaded apps.
          Prefer a reviewed local source build; see `docs/BUILD_ON_MAC.md` for the macOS handoff.

          `SHA256SUMS` covers the archive and `BUILD-INFO.txt`. The GitHub provenance attestation
          identifies the repository/workflow that produced these assets; it is not Apple notarization.
          NOTES
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ntfy-macos $RELEASE_TAG (ad-hoc, unnotarized)" \
            --notes-file release-notes.md \
            --generate-notes \
            dist/*.tar.gz dist/BUILD-INFO.txt dist/SHA256SUMS dist/provenance.jsonl
