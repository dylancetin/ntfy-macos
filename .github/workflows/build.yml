name: Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show build inputs
        run: |
          git rev-parse HEAD
          xcodebuild -version
          swift --version
          uname -m

      - name: Resolve locked dependencies
        run: swift package resolve --force-resolved-versions

      - name: Run tests
        run: swift test --force-resolved-versions

      - name: Build and verify local app bundle
        env:
          SIGNING_IDENTITY: '-'
        run: ./build-app.sh

      - name: Check dependency files stayed unchanged
        run: git diff --exit-code -- Package.swift Package.resolved

      - name: Archive local app bundle
        run: |
          mkdir -p .build/ci-artifacts
          ARCH="$(uname -m)"
          tar -czf ".build/ci-artifacts/ntfy-macos-$ARCH-ad-hoc-unnotarized.tar.gz" -C .build/release ntfy-macos.app

      - name: Upload local build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntfy-macos-local-ad-hoc-unnotarized
          path: .build/ci-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Test summary
        run: |
          {
            echo '### Build and tests passed'
            echo 'The complete Swift test suite passed; see the Run tests step for actual counts.'
            echo 'The archived app is native-architecture, ad-hoc signed, and NOT notarized.'
          } >> "$GITHUB_STEP_SUMMARY"
